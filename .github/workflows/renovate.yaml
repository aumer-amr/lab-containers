name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths: [renovate.json, .github/workflows/renovate.yaml]

concurrency: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          renovate-version: 44.263.1
          mount-docker-socket: false
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
